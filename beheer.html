<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panini Admin — Collectie Overzicht</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#080c14;--bg2:#0d1220;--bg3:#131928;--card:#18203a;--card2:#1e2844;--green:#22c55e;--gold:#f59e0b;--red:#ef4444;--blue:#3b82f6;--text:#f1f5ff;--text2:#8b96b8;--text3:#4a5578;--border:#242e4a;--r:14px;--r2:10px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(34,197,94,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(34,197,94,.03) 1px,transparent 1px);background-size:48px 48px;pointer-events:none;z-index:0}
h1{font-family:'Bebas Neue',sans-serif;font-size:28px;color:var(--gold);letter-spacing:3px;margin-bottom:4px}
.sub{font-size:13px;color:var(--text2);margin-bottom:20px}

/* TABS */
.tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.tab{padding:8px 16px;border-radius:50px;border:1.5px solid var(--border);background:none;color:var(--text2);font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;transition:all .2s}
.tab.active{background:var(--gold);color:#000;border-color:var(--gold)}

/* USER GRID */
.user-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;margin-bottom:20px}
.user-card{background:var(--card);border:1.5px solid var(--border);border-radius:var(--r2);padding:12px;cursor:pointer;transition:all .2s}
.user-card:hover,.user-card.active{border-color:var(--gold)}
.user-card.active{background:var(--card2)}
.u-avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:#fff;margin-bottom:8px}
.u-name{font-size:14px;font-weight:800;margin-bottom:4px}
.u-stats{font-size:11px;color:var(--text2);font-weight:600}
.pbar-bg{background:var(--bg3);border-radius:100px;height:4px;margin-top:6px;overflow:hidden}
.pbar-fill{height:100%;border-radius:100px;background:linear-gradient(90deg,var(--green),var(--gold))}

/* DETAIL */
#detail{display:none;position:relative;z-index:1}
.detail-hdr{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.detail-avatar{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;color:#fff;flex-shrink:0}
.detail-name{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:1px}
.detail-sub{font-size:12px;color:var(--text2);font-weight:600;margin-top:2px}
.back-btn{background:var(--card2);color:var(--text2);border:1px solid var(--border);border-radius:var(--r2);padding:7px 14px;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;margin-left:auto}
.back-btn:hover{border-color:var(--green);color:var(--green)}

/* STATS ROW */
.stats-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r2);padding:12px 16px;text-align:center;flex:1;min-width:80px}
.stat-n{font-family:'Bebas Neue',sans-serif;font-size:30px;line-height:1}
.stat-n.g{color:var(--green)}.stat-n.go{color:var(--gold)}.stat-n.r{color:var(--red)}.stat-n.b{color:var(--blue)}
.stat-l{font-size:10px;color:var(--text2);font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-top:3px}

/* FILTER */
.filter-bar{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;padding-bottom:2px}
.fbtn{padding:6px 13px;border-radius:50px;border:1.5px solid var(--border);background:none;color:var(--text2);font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;flex-shrink:0}
.fbtn.active{background:var(--bg3);color:var(--text);border-color:var(--text3)}
.fbtn.fh.active{background:rgba(34,197,94,.18);border-color:var(--green);color:var(--green)}
.fbtn.fd.active{background:rgba(245,158,11,.18);border-color:var(--gold);color:var(--gold)}
.fbtn.fn.active{background:rgba(239,68,68,.12);border-color:var(--red);color:var(--red)}

/* SEARCH */
.search-wrap{position:relative;margin-bottom:12px}
.search-inp{width:100%;background:var(--card);border:1.5px solid var(--border);border-radius:50px;color:var(--text);font-family:inherit;font-size:14px;font-weight:600;padding:9px 14px;outline:none}
.search-inp:focus{border-color:var(--gold)}
.search-inp::placeholder{color:var(--text3)}

/* COUNTRY SECTION */
.country-block{background:var(--card);border-radius:var(--r);padding:10px 12px;margin-bottom:8px;border:1px solid var(--border)}
.country-hdr{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.country-flag{font-size:20px}
.country-name{font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:1px;flex:1}
.country-prog{font-size:11px;color:var(--text2);font-weight:700}

/* STICKER GRID */
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:5px}
.sc{background:var(--bg3);border:1.5px solid var(--border);border-radius:9px;padding:7px 5px;text-align:center;font-size:11px}
.sc.have{background:rgba(34,197,94,.1);border-color:var(--green)}
.sc.dbl{background:rgba(245,158,11,.1);border-color:var(--gold)}
.sc.need{opacity:.5}
.sc-id{font-family:'Bebas Neue',sans-serif;font-size:13px;color:var(--text2);display:block}
.sc-name{font-size:10px;color:var(--text);font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block;padding:0 2px}
.sc-status{font-size:10px;font-weight:800;display:block;margin-top:2px}
.sc.have .sc-status{color:var(--green)}
.sc.dbl .sc-status{color:var(--gold)}
.sc.need .sc-status{color:var(--text3)}

/* LOADING */
.spinner{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--green);border-radius:50%;animation:spin .7s linear infinite;margin:40px auto}
@keyframes spin{to{transform:rotate(360deg)}}

.section-lbl{font-size:11px;font-weight:800;color:var(--text3);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}

/* EXPORT BTN */
.export-btn{background:var(--card2);color:var(--text2);border:1px solid var(--border);border-radius:var(--r2);padding:7px 14px;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer}
.export-btn:hover{border-color:var(--gold);color:var(--gold)}
</style>
</head>
<body style="position:relative;z-index:1">

<h1>⚽ Panini Admin</h1>
<div class="sub">Collectie overzicht — alle deelnemers</div>

<div id="loading"><div class="spinner"></div><div style="text-align:center;color:var(--text2);font-size:13px;font-weight:600">Data laden...</div></div>

<!-- OVERZICHT -->
<div id="overview" style="display:none">
  <div class="section-lbl">Klik op een deelnemer voor details</div>
  <div class="user-grid" id="user-grid"></div>
</div>

<!-- DETAIL -->
<div id="detail">
  <div class="detail-hdr">
    <div class="detail-avatar" id="d-avatar"></div>
    <div>
      <div class="detail-name" id="d-name"></div>
      <div class="detail-sub" id="d-sub"></div>
    </div>
    <div style="display:flex;gap:8px;margin-left:auto;flex-wrap:wrap">
      <button class="export-btn" onclick="exportUser()">📥 Export CSV</button>
      <button class="back-btn" onclick="showOverview()">← Terug</button>
    </div>
  </div>

  <div class="stats-row" id="d-stats"></div>

  <div class="filter-bar">
    <button class="fbtn active" id="df-all"    onclick="setFilter('all'   )">Alles</button>
    <button class="fbtn fh"    id="df-have"   onclick="setFilter('have'  )">✓ Heb ik</button>
    <button class="fbtn fd"    id="df-dbl"    onclick="setFilter('double')">★ Dubbel</button>
    <button class="fbtn fn"    id="df-need"   onclick="setFilter('need'  )">✗ Nodig</button>
  </div>

  <div class="search-wrap">
    <input type="text" class="search-inp" id="d-search" placeholder="Zoeken op nummer of naam..." autocomplete="off">
  </div>

  <div id="d-content"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBIR1PQ5Q7Hk18dX7K20OW3WQtFMSViaSo",
  authDomain: "panini-wk26.firebaseapp.com",
  projectId: "panini-wk26",
  storageBucket: "panini-wk26.firebasestorage.app",
  messagingSenderId: "1072239827458",
  appId: "1:1072239827458:web:263338f61504c12fdf251b"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let allUsers = {};
let currentUser = null;
let currentFilter = 'all';
let currentSearch = '';

const COLORS = [['#22c55e','#16a34a'],['#3b82f6','#1d4ed8'],['#f59e0b','#d97706'],['#8b5cf6','#6d28d9'],['#ef4444','#b91c1c'],['#06b6d4','#0891b2'],['#ec4899','#be185d'],['#14b8a6','#0f766e']];
function avatarColor(name){ let h=0; for(const c of name) h=(h*31+c.charCodeAt(0))&0xFFFFFF; return COLORS[Math.abs(h)%COLORS.length]; }
function initials(name){ return name.slice(0,2).toUpperCase(); }

// Load all users
async function boot() {
  try {
    const snap = await getDocs(collection(db, 'users'));
    allUsers = {};
    snap.forEach(d => { allUsers[d.id] = d.data(); });
    renderOverview();
    document.getElementById('loading').style.display = 'none';
    document.getElementById('overview').style.display = 'block';
  } catch(e) {
    document.getElementById('loading').innerHTML = '<div style="text-align:center;color:var(--red);padding:40px">Fout bij laden: ' + e.message + '</div>';
  }
}

function renderOverview() {
  const grid = document.getElementById('user-grid');
  const total = STICKER_DATA.total;
  const sorted = Object.entries(allUsers).sort((a,b) => {
    const ha = Object.values(a[1].coll||{}).filter(v=>v>=1).length;
    const hb = Object.values(b[1].coll||{}).filter(v=>v>=1).length;
    return hb - ha;
  });

  grid.innerHTML = sorted.map(([uid, data]) => {
    const name = data.name || uid;
    const coll = data.coll || {};
    const have = Object.values(coll).filter(v=>v>=1).length;
    const dbl = Object.values(coll).filter(v=>v>=2).length;
    const pct = Math.round(have/total*100);
    const [c1,c2] = avatarColor(name);
    return `<div class="user-card" onclick="showUser('${uid}')">
      <div class="u-avatar" style="background:linear-gradient(135deg,${c1},${c2})">${initials(name)}</div>
      <div class="u-name">${name}</div>
      <div class="u-stats">${have} stickers · ${dbl} dubbels · ${pct}%</div>
      <div class="pbar-bg"><div class="pbar-fill" style="width:${pct}%"></div></div>
    </div>`;
  }).join('');
}

window.showUser = function(uid) {
  currentUser = uid;
  currentFilter = 'all';
  currentSearch = '';
  document.getElementById('d-search').value = '';
  document.querySelectorAll('.fbtn').forEach(b => b.classList.remove('active'));
  document.getElementById('df-all').classList.add('active');

  const data = allUsers[uid] || {};
  const name = data.name || uid;
  const coll = data.coll || {};
  const have = Object.values(coll).filter(v=>v>=1).length;
  const dbl = Object.values(coll).filter(v=>v>=2).reduce((s,v)=>s+(v-1),0);
  const need = STICKER_DATA.total - have;
  const pct = Math.round(have/STICKER_DATA.total*100);
  const [c1,c2] = avatarColor(name);

  document.getElementById('d-avatar').textContent = initials(name);
  document.getElementById('d-avatar').style.background = `linear-gradient(135deg,${c1},${c2})`;
  document.getElementById('d-name').textContent = name;
  document.getElementById('d-sub').textContent = `${pct}% compleet`;

  document.getElementById('d-stats').innerHTML = `
    <div class="stat-card"><div class="stat-n g">${have}</div><div class="stat-l">Heb ik</div></div>
    <div class="stat-card"><div class="stat-n go">${dbl}</div><div class="stat-l">Dubbels</div></div>
    <div class="stat-card"><div class="stat-n r">${need}</div><div class="stat-l">Nodig</div></div>
    <div class="stat-card"><div class="stat-n b">${pct}%</div><div class="stat-l">Compleet</div></div>
  `;

  document.getElementById('overview').style.display = 'none';
  document.getElementById('detail').style.display = 'block';
  renderDetail();
};

window.showOverview = function() {
  document.getElementById('detail').style.display = 'none';
  document.getElementById('overview').style.display = 'block';
  currentUser = null;
};

window.setFilter = function(f) {
  currentFilter = f;
  ['all','have','dbl','need'].forEach(x => document.getElementById('df-'+x)?.classList.remove('active'));
  const map = {all:'all',have:'have',double:'dbl',need:'need'};
  document.getElementById('df-'+(map[f]||f))?.classList.add('active');
  renderDetail();
};

document.getElementById('d-search').addEventListener('input', e => {
  currentSearch = e.target.value.toLowerCase();
  renderDetail();
});

function renderDetail() {
  if(!currentUser) return;
  const coll = (allUsers[currentUser]||{}).coll || {};
  const container = document.getElementById('d-content');
  let html = '';

  for(const [code, group] of Object.entries(STICKER_DATA.groups)) {
    let stickers = group.stickers;

    if(currentSearch) stickers = stickers.filter(s =>
      s.id.toLowerCase().includes(currentSearch) ||
      s.name.toLowerCase().includes(currentSearch) ||
      group.name.toLowerCase().includes(currentSearch)
    );

    if(currentFilter !== 'all') stickers = stickers.filter(s => {
      const st = coll[s.id]||0;
      if(currentFilter==='have') return st===1;
      if(currentFilter==='double') return st>=2;
      if(currentFilter==='need') return st===0;
      return true;
    });

    if(!stickers.length) continue;

    const hv = stickers.filter(s=>(coll[s.id]||0)>=1).length;
    const pct = Math.round(hv/stickers.length*100);

    html += `<div class="country-block">
      <div class="country-hdr">
        <span class="country-flag">${group.flag}</span>
        <span class="country-name">${group.name}</span>
        <span class="country-prog">${hv}/${stickers.length}</span>
      </div>
      <div class="pbar-bg" style="margin-bottom:8px"><div class="pbar-fill" style="width:${pct}%"></div></div>
      <div class="sgrid">`;

    for(const s of stickers) {
      const st = coll[s.id]||0;
      const cls = st>=2?'dbl':st===1?'have':'need';
      const statusTxt = st>=2?'⭐ '+( st-1)+'x dubbel':st===1?'✓ Heb ik':'✗ Nodig';
      html += `<div class="sc ${cls}">
        <span class="sc-id">${s.id}</span>
        <span class="sc-name">${s.name}</span>
        <span class="sc-status">${statusTxt}</span>
      </div>`;
    }
    html += '</div></div>';
  }

  if(!html) html = '<div style="text-align:center;padding:30px;color:var(--text3);font-size:13px">Geen stickers gevonden</div>';
  container.innerHTML = html;
}

window.exportUser = function() {
  if(!currentUser) return;
  const data = allUsers[currentUser]||{};
  const name = data.name || currentUser;
  const coll = data.coll||{};

  const rows = [];
  for(const [code, group] of Object.entries(STICKER_DATA.groups)) {
    for(const s of group.stickers) {
      const st = coll[s.id]||0;
      rows.push({
        Nummer: s.id,
        Naam: s.name,
        Land: group.name,
        Status: st>=2?'Dubbel ('+( st-1)+'x)':st===1?'Heb ik':'Nodig'
      });
    }
  }

  const headers = ['Nummer','Naam','Land','Status'];
  const csv = [headers.join(';'), ...rows.map(r=>headers.map(h=>`"${r[h]}"`).join(';'))].join('\n');
  const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `panini-${name.toLowerCase()}-collectie.csv`;
  a.click();
};

boot();
</script>
