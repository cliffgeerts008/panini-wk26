<html lang="nl"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ruil Optimalisator</title>
<link href="./ruilen_files/css2" rel="stylesheet">
<style>
:root{--bg:#080c14;--bg2:#0d1220;--bg3:#131928;--card:#18203a;--card2:#1e2844;--green:#22c55e;--gold:#f59e0b;--red:#ef4444;--blue:#3b82f6;--text:#f1f5ff;--text2:#8b96b8;--text3:#4a5578;--border:#242e4a;--r:14px;--r2:10px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(34,197,94,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(34,197,94,.03) 1px,transparent 1px);background-size:48px 48px;pointer-events:none;z-index:0}

h1{font-family:'Bebas Neue',sans-serif;font-size:28px;color:var(--gold);letter-spacing:3px;margin-bottom:4px}
.sub{font-size:13px;color:var(--text2);margin-bottom:20px}

/* LOGIN */
#login-box{max-width:400px;margin:60px auto;background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:24px;text-align:center}
#login-box h2{font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--gold);letter-spacing:2px;margin-bottom:16px}
#name-inp{width:100%;background:var(--bg3);border:1.5px solid var(--border);border-radius:var(--r2);color:var(--text);font-family:inherit;font-size:15px;font-weight:700;padding:11px 13px;outline:none;margin-bottom:10px;text-align:center}
#name-inp:focus{border-color:var(--gold)}
#name-inp::placeholder{color:var(--text3)}
#login-btn{width:100%;background:var(--gold);color:#000;border:none;border-radius:var(--r2);padding:13px;font-family:inherit;font-size:15px;font-weight:800;cursor:pointer}
#login-btn:hover{opacity:.9}

/* LOADING */
#loading-box{text-align:center;padding:60px 20px}
.spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--green);border-radius:50%;animation:spin .7s linear infinite;margin:16px auto}
@keyframes spin{to{transform:rotate(360deg)}}

/* STATS BAR */
.stats-bar{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px;padding:14px 16px;background:var(--card);border-radius:var(--r);border:1px solid var(--border)}
.stat{text-align:center}
.stat-n{font-family:'Bebas Neue',sans-serif;font-size:28px;line-height:1}
.stat-n.g{color:var(--green)}.stat-n.go{color:var(--gold)}.stat-n.r{color:var(--red)}.stat-n.b{color:var(--blue)}
.stat-l{font-size:10px;color:var(--text2);font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.stat-sep{color:var(--border);font-size:24px;align-self:center}

/* SECTION */
.section-title{font-size:12px;font-weight:800;color:var(--text3);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;margin-top:20px}

/* TRADE CARD */
.trade-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:14px;margin-bottom:10px}
.trade-hdr{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.avatar{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;color:#fff;flex-shrink:0}
.trade-name{font-size:15px;font-weight:800}
.trade-sub{font-size:12px;color:var(--text2);font-weight:600;margin-top:2px}
.score-badge{margin-left:auto;background:var(--green);color:#000;border-radius:50px;padding:4px 12px;font-size:13px;font-weight:800}
.score-badge.med{background:var(--gold)}
.score-badge.low{background:var(--bg3);color:var(--text2);border:1px solid var(--border)}

/* TRADE COLS */
.trade-cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:480px){.trade-cols{grid-template-columns:1fr}}
.trade-col-hdr{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;padding:7px 10px;border-radius:8px;margin-bottom:6px}
.trade-col-hdr.give{background:rgba(245,158,11,.12);color:var(--gold)}
.trade-col-hdr.get{background:rgba(34,197,94,.12);color:var(--green)}
.sticker-row{display:flex;align-items:center;gap:7px;padding:5px 8px;background:var(--bg3);border-radius:7px;margin-bottom:3px;border:1px solid var(--border)}
.sticker-row.give-row{border-left:3px solid var(--gold)}
.sticker-row.get-row{border-left:3px solid var(--green)}
.s-id{font-family:'Bebas Neue',sans-serif;font-size:14px;color:var(--text);min-width:48px}
.s-name{font-size:11px;color:var(--text2);font-weight:700;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.s-cnt{font-size:11px;font-weight:800;color:var(--gold)}
.more{font-size:11px;color:var(--text3);font-weight:600;padding:4px 8px}

/* NO TRADES */
.empty{text-align:center;padding:30px;color:var(--text3);font-size:13px;font-weight:600}
.empty .ico{font-size:36px;margin-bottom:8px}

/* SUMMARY TABLE */
.summary-table{width:100%;border-collapse:collapse;font-size:13px}
.summary-table th{text-align:left;padding:8px 10px;font-size:11px;font-weight:800;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border)}
.summary-table td{padding:8px 10px;border-bottom:1px solid var(--border)}
.summary-table tr:last-child td{border-bottom:none}
.summary-table tr:hover td{background:var(--bg3)}
.badge{display:inline-block;border-radius:50px;padding:2px 8px;font-size:11px;font-weight:800}
.badge-green{background:rgba(34,197,94,.2);color:var(--green)}
.badge-gold{background:rgba(245,158,11,.2);color:var(--gold)}

/* REFRESH BTN */
.refresh-btn{background:var(--card2);color:var(--text2);border:1px solid var(--border);border-radius:var(--r2);padding:8px 16px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;margin-bottom:16px}
.refresh-btn:hover{border-color:var(--green);color:var(--green)}

.back-btn{display:inline-flex;align-items:center;gap:6px;color:var(--text2);font-size:13px;font-weight:700;text-decoration:none;margin-bottom:16px;cursor:pointer}
.back-btn:hover{color:var(--gold)}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-box">
  <div style="font-size:36px;margin-bottom:12px">⚽</div>
  <h2>Ruil Optimalisator</h2>
  <p style="font-size:13px;color:var(--text2);margin-bottom:16px">Geef je naam in om je beste ruilkansen te zien</p>
  <input type="text" id="name-inp" placeholder="Jouw naam..." maxlength="20" autocomplete="off">
  <button id="login-btn">Bekijk mijn ruilkansen →</button>
</div>

<!-- LOADING -->
<div id="loading-box" style="display:none">
  <div style="font-size:48px">⚽</div>
  <div class="spinner"></div>
  <div style="color:var(--text2);font-size:13px;font-weight:600" id="loading-msg">Data laden...</div>
</div>

<!-- RESULTS -->
<div id="results" style="display:none;position:relative;z-index:1">
  <a class="back-btn" onclick="document.getElementById(&#39;results&#39;).style.display=&#39;none&#39;;document.getElementById(&#39;login-box&#39;).style.display=&#39;block&#39;">← Andere naam</a>
  <h1>Ruil Optimalisator</h1>
  <div class="sub" id="result-sub"></div>
  <button class="refresh-btn" onclick="refreshData()">↻ Vernieuwen</button>

  <div class="stats-bar" id="stats-bar"></div>

  <div class="section-title">Samenvatting — beste ruilpartners</div>
  <div style="background:var(--card);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:20px">
    <table class="summary-table" id="summary-table"></table>
  </div>

  <div class="section-title" id="trades-title">Ruildetails per persoon</div>
  <div id="trades-list"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBIR1PQ5Q7Hk18dX7K20OW3WQtFMSViaSo",
  authDomain: "panini-wk26.firebaseapp.com",
  projectId: "panini-wk26",
  storageBucket: "panini-wk26.firebasestorage.app",
  messagingSenderId: "1072239827458",
  appId: "1:1072239827458:web:263338f61504c12fdf251b"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let myId = null, myName = null, allUsers = {};

// Avatar colours
const COLORS = [['#22c55e','#16a34a'],['#3b82f6','#1d4ed8'],['#f59e0b','#d97706'],['#8b5cf6','#6d28d9'],['#ef4444','#b91c1c'],['#06b6d4','#0891b2'],['#ec4899','#be185d'],['#14b8a6','#0f766e']];
function avatarColor(name){ let h=0; for(const c of name) h=(h*31+c.charCodeAt(0))&0xFFFFFF; return COLORS[Math.abs(h)%COLORS.length]; }
function initials(name){ return name.slice(0,2).toUpperCase(); }

// Sticker name lookup
function sName(id){
  if(typeof STICKER_DATA === 'undefined') return id;
  for(const g of Object.values(STICKER_DATA.groups)){
    const s=g.stickers.find(x=>x.id===id);
    if(s) return s.name;
  }
  return id;
}

// Sticker order for sorting
function buildOrder(){
  const o={};let p=0;
  if(typeof STICKER_DATA==='undefined') return o;
  for(const g of Object.values(STICKER_DATA.groups))
    for(const s of g.stickers) o[s.id]=p++;
  return o;
}

window.loadData = async function() {
  const name = document.getElementById('name-inp').value.trim();
  if(name.length < 2){ alert('Voer minstens 2 tekens in'); return; }

  myName = name;
  myId = name.toLowerCase().replace(/[^a-z0-9]/g,'_').replace(/_+/g,'_');

  document.getElementById('login-box').style.display = 'none';
  document.getElementById('loading-box').style.display = 'block';
  document.getElementById('loading-msg').textContent = 'Alle collecties laden...';

  try {
    const snap = await getDocs(collection(db, 'users'));
    allUsers = {};
    snap.forEach(d => { allUsers[d.id] = d.data(); });

    if(!allUsers[myId]){
      alert('Naam "'+name+'" niet gevonden in de database.\nControleer of je naam exact overeenkomt met de app.');
      document.getElementById('loading-box').style.display = 'none';
      document.getElementById('login-box').style.display = 'block';
      return;
    }

    document.getElementById('loading-box').style.display = 'none';
    renderResults();
  } catch(e) {
    alert('Fout bij laden: ' + e.message);
    document.getElementById('loading-box').style.display = 'none';
    document.getElementById('login-box').style.display = 'block';
  }
};

window.refreshData = async function() {
  document.getElementById('loading-box').style.display = 'block';
  document.getElementById('results').style.display = 'none';
  document.getElementById('loading-msg').textContent = 'Vernieuwen...';
  try {
    const snap = await getDocs(collection(db, 'users'));
    allUsers = {};
    snap.forEach(d => { allUsers[d.id] = d.data(); });
    document.getElementById('loading-box').style.display = 'none';
    renderResults();
  } catch(e) {
    alert('Fout: ' + e.message);
    document.getElementById('loading-box').style.display = 'none';
    document.getElementById('results').style.display = 'block';
  }
};

function renderResults() {
  const myColl = JSON.parse(JSON.stringify((allUsers[myId]||{}).coll || {})); // werk op kopie
  const order = buildOrder();

  // ── GREEDY OPTIMALISATIE ──
  // Bereken optimaal ruilplan rekening houdend met beschikbare dubbels
  function calcTrades(coll, fColl) {
    const give = Object.entries(coll)
      .filter(([id,st]) => st>=2 && (fColl[id]||0)===0)
      .map(([id,st]) => ({id, extras:st-1}))
      .sort((a,b) => (order[a.id]||9999)-(order[b.id]||9999));
    const get = Object.entries(fColl)
      .filter(([id,st]) => st>=2 && (coll[id]||0)===0)
      .map(([id,st]) => ({id, extras:st-1}))
      .sort((a,b) => (order[a.id]||9999)-(order[b.id]||9999));
    const n = Math.min(give.length, get.length);
    return { give: give.slice(0,n), get: get.slice(0,n), n };
  }

  // Greedy: kies steeds de beste resterende partner
  const workColl = JSON.parse(JSON.stringify(myColl));
  const plan = []; // [{fname, uid, give, get, n}]
  const allFriends = Object.entries(allUsers).filter(([uid]) => uid !== myId);

  for(let round = 0; round < allFriends.length; round++) {
    let best = null;
    for(const [uid, udata] of allFriends) {
      if(plan.find(p => p.uid === uid)) continue; // al gepland
      const fColl = udata.coll || {};
      const {give, get, n} = calcTrades(workColl, fColl);
      if(n > 0 && (!best || n > best.n)) {
        best = {uid, fname: udata.name||uid, give, get, n, fColl};
      }
    }
    if(!best) break;

    // Voer ruil uit op werkende collectie
    for(const s of best.give) {
      workColl[s.id] = (workColl[s.id]||0) - 1;
      if(workColl[s.id] <= 0) delete workColl[s.id];
    }
    for(const s of best.get) {
      workColl[s.id] = 1;
    }
    plan.push(best);
  }

  // Niet-optimale trades (mensen met wie je kan geven maar na optimalisatie niks overblijft)
  const notInPlan = allFriends
    .filter(([uid]) => !plan.find(p => p.uid === uid))
    .map(([uid, udata]) => {
      const origColl = (allUsers[myId]||{}).coll||{};
      const fColl = udata.coll||{};
      const give0 = Object.entries(origColl).filter(([id,st])=>st>=2&&(fColl[id]||0)===0);
      const get0  = Object.entries(fColl).filter(([id,st])=>st>=2&&(origColl[id]||0)===0);
      return {uid, fname:udata.name||uid, give:give0.map(([id,st])=>({id,extras:st-1})), get:get0.map(([id,st])=>({id,extras:st-1})), n:0, fColl};
    })
    .filter(t => t.give.length > 0 || t.get.length > 0);
  // myColl al gedeclareerd hierboven
  const order = buildOrder();

  // My stats (op basis van originele collectie)
  const origMyColl = (allUsers[myId]||{}).coll||{};
  let myHave=0, myDbl=0;
  for(const st of Object.values(origMyColl)){
    if(st===1) myHave++;
    else if(st>=2){ myHave++; myDbl+=(st-1); }
  }
  const myNeed = (typeof STICKER_DATA !== 'undefined' ? STICKER_DATA.total : 980) - myHave;

  // trades = plan (geoptimaliseerd) voor gebruik in stats/summary/details

  // Stats bar
  document.getElementById('stats-bar').innerHTML = `
    <div class="stat"><div class="stat-n g">${myHave}</div><div class="stat-l">Heb ik</div></div>
    <div class="stat-sep">·</div>
    <div class="stat"><div class="stat-n go">${myDbl}</div><div class="stat-l">Dubbels</div></div>
    <div class="stat-sep">·</div>
    <div class="stat"><div class="stat-n r">${myNeed}</div><div class="stat-l">Nodig</div></div>
    <div class="stat-sep">·</div>
    <div class="stat"><div class="stat-n b">${plan.length}</div><div class="stat-l">Ruilpartners</div></div>
  `;

  document.getElementById('result-sub').textContent = myName + ' · geoptimaliseerd ruilplan · ' + plan.length + ' partners';

  // Summary table
  const summaryRows = plan;
  if(summaryRows.length === 0){
    document.getElementById('summary-table').innerHTML = '<tr><td colspan="4" style="padding:20px;text-align:center;color:var(--text3)">Geen ruilkansen gevonden</td></tr>';
  } else {
    document.getElementById('summary-table').innerHTML =
      '<thead><tr><th>Volgorde</th><th>Naam</th><th>Ik geef</th><th>Ik krijg</th><th>Match</th></tr></thead><tbody>' +
      summaryRows.map((t,i) => {
        const scoreCls = t.n >= 5 ? 'badge-green' : t.n >= 2 ? 'badge-gold' : '';
        return '<tr>'
          + '<td style="color:var(--text3);font-weight:800">'+(i+1)+'</td>'
          + '<td><strong>'+t.fname+'</strong></td>'
          + '<td><span class="badge badge-gold">'+t.give.length+'</span></td>'
          + '<td><span class="badge badge-green">'+t.get.length+'</span></td>'
          + '<td><span class="badge '+scoreCls+'">'+t.n+'x</span></td>'
          + '</tr>';
      }).join('') + '</tbody>';
  }

  // Trade details
  document.getElementById('trades-title').textContent = 'Geoptimaliseerd ruilplan — in deze volgorde uitvoeren';

  let html = '';

  if(plan.length === 0){
    html = '<div class="empty"><div class="ico">🔄</div><p>Geen ruilkansen gevonden.<br>Voeg meer dubbels toe in de app!</p></div>';
  }

  plan.forEach((t, i) => {
    html += '<div style="font-size:11px;font-weight:800;color:var(--text3);text-transform:uppercase;letter-spacing:1px;margin:16px 0 8px">Stap '+(i+1)+' — '+t.fname+'</div>';
    html += renderTradeCard(t, true);
  });

  if(notInPlan.filter(t=>t.give.length>0||t.get.length>0).length > 0){
    html += '<div class="section-title" style="margin-top:24px">Overige — dubbels al ingezet of geen match</div>';
    for(const t of notInPlan){
      html += renderTradeCard(t, false);
    }
  }

  document.getElementById('trades-list').innerHTML = html;
  document.getElementById('results').style.display = 'block';
}

function renderTradeCard(t, hasMatch){
  const [c1,c2] = avatarColor(t.fname);
  const scoreNum = t.n || t.maxTrade || 0;
  const scoreCls = scoreNum >= 5 ? '' : scoreNum >= 2 ? 'med' : 'low';
  const giveSlice = t.give.slice(0, t.maxTrade || t.give.length);
  const getSlice = t.get.slice(0, t.maxTrade);

  let html = '<div class="trade-card">';
  html += '<div class="trade-hdr">';
  html += '<div class="avatar" style="background:linear-gradient(135deg,'+c1+','+c2+')">'+initials(t.fname)+'</div>';
  html += '<div><div class="trade-name">'+t.fname+'</div>';
  html += '<div class="trade-sub">'+t.give.length+' te geven · '+t.get.length+' te krijgen</div></div>';
  if(hasMatch) html += '<div class="score-badge '+scoreCls+'">'+scoreNum+'x ruil</div>';
  html += '</div>';

  html += '<div class="trade-cols">';

  // Give column
  html += '<div>';
  html += '<div class="trade-col-hdr give">Ik geef <span style="background:rgba(245,158,11,.2);border-radius:50px;padding:1px 7px">'+giveSlice.length+'</span></div>';
  if(giveSlice.length){
    giveSlice.forEach(s => {
      html += '<div class="sticker-row give-row"><span class="s-id">'+s.id+'</span><span class="s-name">'+sName(s.id)+'</span>'+(s.extras>1?'<span class="s-cnt">x'+s.extras+'</span>':'')+'</div>';
    });
    if(t.give.length > giveSlice.length) html += '<div class="more">+' + (t.give.length - giveSlice.length) + ' meer...</div>';
  } else {
    html += '<div style="font-size:12px;color:var(--text3);padding:8px">Niets te geven</div>';
  }
  html += '</div>';

  // Get column
  html += '<div>';
  html += '<div class="trade-col-hdr get">Ik krijg <span style="background:rgba(34,197,94,.2);border-radius:50px;padding:1px 7px">'+getSlice.length+'</span></div>';
  if(getSlice.length){
    getSlice.forEach(s => {
      html += '<div class="sticker-row get-row"><span class="s-id">'+s.id+'</span><span class="s-name">'+sName(s.id)+'</span>'+(s.extras>1?'<span class="s-cnt" style="color:var(--green)">x'+s.extras+'</span>':'')+'</div>';
    });
    if(t.get.length > getSlice.length) html += '<div class="more">+' + (t.get.length - getSlice.length) + ' meer...</div>';
  } else {
    html += '<div style="font-size:12px;color:var(--text3);padding:8px">Niets te krijgen</div>';
  }
  html += '</div>';

  html += '</div></div>';
  return html;
}

// Knoppen
document.getElementById('login-btn').addEventListener('click', loadData);
document.getElementById('name-inp').addEventListener('keydown', e => {
  if(e.key === 'Enter') loadData();
});
