<!DOCTYPE html>

<html lang="nl"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panini Admin Tool</title>
<style>
  body { font-family: sans-serif; background: #0a0e1a; color: #eef2ff; padding: 30px; max-width: 600px; margin: 0 auto; }
  h1 { color: #f59e0b; margin-bottom: 4px; }
  p { color: #9aa5c0; font-size: 13px; margin-bottom: 20px; }
  .log { background: #1a2038; border-radius: 10px; padding: 16px; margin-top: 16px; font-size: 13px; line-height: 1.9; font-family: monospace; min-height: 80px; }
  .ok  { color: #22c55e; }
  .err { color: #ef4444; }
  .info{ color: #9aa5c0; }
  .warn{ color: #f59e0b; }
  .user-list { margin: 16px 0; }
  .user-row { display:flex; align-items:center; gap:12px; background:#1a2038; border-radius:10px; padding:12px 16px; margin-bottom:6px; border:1px solid #2a3050; }
  .user-row .name { flex:1; font-weight:700; }
  .user-row .count { font-size:12px; color:#9aa5c0; }
  .user-row .del-btn { background:#ef4444; color:#fff; border:none; border-radius:7px; padding:6px 14px; font-size:12px; font-weight:700; cursor:pointer; }
  .user-row .del-btn:hover { opacity:.85; }
  .user-row.zero { border-color:#ef444440; background:#1f1020; }
  .user-row.zero .count { color:#ef4444; }
  button.main { background:#f59e0b; color:#000; border:none; border-radius:8px; padding:13px 24px; font-size:14px; font-weight:800; cursor:pointer; margin-right:8px; }
  button.main:disabled { opacity:.5; cursor:not-allowed; }
  button.danger { background:#ef4444; color:#fff; border:none; border-radius:8px; padding:13px 24px; font-size:14px; font-weight:800; cursor:pointer; }
  button.danger:disabled { opacity:.5; cursor:not-allowed; }
</style>
</head>
<body>
<h1>🛠️ Panini Admin Tool</h1>
<p>Beheer gebruikers in de database. Alleen voor admins!</p>

<button class="main" id="load-btn" onclick="loadUsers()">👥 Gebruikers laden</button>
<button class="danger" id="delete-zero-btn" onclick="deleteAllZero()" disabled="">🗑️ Verwijder alle 0-sticker gebruikers</button>

<div id="user-list" class="user-list"></div>
<div class="log" id="log"><span class="info">Klik op "Gebruikers laden" om te starten...</span></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBIR1PQ5Q7Hk18dX7K20OW3WQtFMSViaSo",
  authDomain: "panini-wk26.firebaseapp.com",
  projectId: "panini-wk26",
  storageBucket: "panini-wk26.firebasestorage.app",
  messagingSenderId: "1072239827458",
  appId: "1:1072239827458:web:263338f61504c12fdf251b"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
let allUsers = [];

function log(msg, type='info') {
  const el = document.getElementById('log');
  el.innerHTML += `<div class="${type}">${msg}</div>`;
  el.scrollTop = el.scrollHeight;
}

function countStickers(coll) {
  return Object.values(coll || {}).filter(v => v >= 1).length;
}

window.loadUsers = async function() {
  document.getElementById('load-btn').disabled = true;
  document.getElementById('log').innerHTML = '';
  document.getElementById('user-list').innerHTML = '';
  log('Gebruikers ophalen...', 'info');

  try {
    const snap = await getDocs(collection(db, 'users'));
    allUsers = [];
    snap.forEach(d => {
      const data = d.data();
      const count = countStickers(data.coll);
      allUsers.push({ id: d.id, name: data.name || d.id, count });
    });

    allUsers.sort((a, b) => a.count - b.count);

    const zeroCount = allUsers.filter(u => u.count === 0).length;
    log(`${allUsers.length} gebruikers gevonden — ${zeroCount} met 0 stickers.`, 'info');

    // Render lijst
    const listEl = document.getElementById('user-list');
    listEl.innerHTML = allUsers.map(u => `
      <div class="user-row ${u.count === 0 ? 'zero' : ''}">
        <div class="name">${u.name}</div>
        <div class="count">${u.count} stickers</div>
        <button class="del-btn" onclick="deleteUser('${u.id}', '${u.name.replace(/'/g,"\\'")}')">🗑️ Verwijder</button>
      </div>
    `).join('');

    if (zeroCount > 0) {
      document.getElementById('delete-zero-btn').disabled = false;
    }
  } catch(e) {
    log('❌ Fout: ' + e.message, 'err');
  }
  document.getElementById('load-btn').disabled = false;
};

window.deleteUser = async function(id, name) {
  if (!confirm(`"${name}" definitief verwijderen?`)) return;
  try {
    await deleteDoc(doc(db, 'users', id));
    log(`✅ ${name} verwijderd.`, 'ok');
    allUsers = allUsers.filter(u => u.id !== id);
    // Verwijder rij uit lijst
    await loadUsers();
  } catch(e) {
    log(`❌ Fout bij verwijderen van ${name}: ` + e.message, 'err');
  }
};

window.deleteAllZero = async function() {
  const zeros = allUsers.filter(u => u.count === 0);
  if (!zeros.length) { log('Geen gebruikers met 0 stickers.', 'warn'); return; }
  if (!confirm(`${zeros.length} gebruiker(s) met 0 stickers verwijderen?\n\n${zeros.map(u=>u.name).join(', ')}`)) return;

  document.getElementById('delete-zero-btn').disabled = true;
  for (const u of zeros) {
    try {
      await deleteDoc(doc(db, 'users', u.id));
      log(`✅ ${u.name} verwijderd.`, 'ok');
    } catch(e) {
      log(`❌ Fout bij ${u.name}: ` + e.message, 'err');
    }
  }
  log('Klaar! Lijst herladen...', 'info');
  await loadUsers();
};
</script>


</body></html>
